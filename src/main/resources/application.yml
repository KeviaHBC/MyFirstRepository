server:
  port: 8080

spring:
  application:
    name: scaffold

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      url: jdbc:h2:mem:scaffold;MODE=MYSQL;DB_CLOSE_DELAY=-1
      username: sa
      password:
      driver-class-name: org.h2.Driver
      initial-size: 5
      min-idle: 5
      max-active: 20
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: ${DRUID_USER:admin}
        login-password: ${DRUID_PASSWORD:admin123}
      filter:
        stat:
          enabled: true
          slow-sql-millis: 1000
        wall:
          enabled: true

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: embedded
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

knife4j:
  enable: true
  setting:
    language: zh_cn

jwt:
  secret: ${JWT_SECRET:scaffold-dev-secret}
  expiration: 604800000
