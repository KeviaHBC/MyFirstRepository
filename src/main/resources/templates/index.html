<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Scaffold 首页</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.8/dist/css/layui.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="layui-layout layui-layout-admin">
    <div class="layui-header">
        <div class="layui-logo">Scaffold 脚手架</div>
        <div class="header-right">
            <button class="theme-toggle" id="themeToggle" title="切换亮/暗主题">◐</button>
            <ul class="layui-nav">
                <li class="layui-nav-item"><a href="javascript:;" id="usernameText"></a></li>
                <li class="layui-nav-item"><a href="javascript:;" onclick="logout()">退出</a></li>
            </ul>
        </div>
    </div>
    <div class="layui-side layui-bg-black">
        <ul class="layui-nav layui-nav-tree">
            <li class="layui-nav-item"><a href="/page/user">用户管理</a></li>
            <li class="layui-nav-item"><a href="/page/article">文章管理</a></li>
            <li class="layui-nav-item"><a href="/page/product">商品管理</a></li>
        </ul>
    </div>
    <div class="layui-body">
        <iframe id="contentFrame" style="width:100%;height:100%;border:none;"></iframe>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/layui@2.9.8/dist/layui.js"></script>
<script src="/js/chat.js"></script>
<script th:inline="none">
// ── 认证 ────────────────────────────────────────────────
var token = localStorage.getItem('token');
if (!token) {
    layui.use('layer', function() {
        layer.open({
            title: '提示',
            content: '您还未登录，请先登录',
            btn: ['去登录'],
            yes: function() { location.href = '/login'; },
            closeBtn: false
        });
    });
} else {
    document.getElementById('usernameText').textContent = localStorage.getItem('username');
}

// ── 主题管理 ────────────────────────────────────────────
var THEME_KEY = 'scaffold-theme';

function getTheme() {
    return localStorage.getItem(THEME_KEY) || 'dark';
}

function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem(THEME_KEY, theme);
    var btn = document.getElementById('themeToggle');
    if (btn) btn.textContent = theme === 'light' ? '◑' : '◐';
    // 同步到 iframe 子页面
    var iframe = document.getElementById('contentFrame');
    if (iframe && iframe.contentWindow) {
        iframe.contentWindow.postMessage({ type: 'theme-change', theme: theme }, '*');
    }
}

// 初始化主题
setTheme(getTheme());

// 监听 iframe 就绪后同步主题
var contentFrame = document.getElementById('contentFrame');
contentFrame.addEventListener('load', function() {
    var theme = getTheme();
    if (contentFrame.contentWindow) {
        contentFrame.contentWindow.postMessage({ type: 'theme-change', theme: theme }, '*');
    }
});

// 主题切换按钮
document.getElementById('themeToggle').addEventListener('click', function() {
    var next = getTheme() === 'dark' ? 'light' : 'dark';
    setTheme(next);
});

// ── 侧边栏导航 ──────────────────────────────────────────
var contentFrame = document.getElementById('contentFrame');
document.querySelectorAll('.layui-nav-tree .layui-nav-item a').forEach(function(a) {
    a.onclick = function() {
        contentFrame.style.opacity = '0';
        contentFrame.src = this.getAttribute('href');
        return false;
    };
});
contentFrame.addEventListener('load', function() {
    contentFrame.style.opacity = '1';
});

// ── 退出 ────────────────────────────────────────────────
function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('username');
    location.href = '/login';
}
</script>
<!-- ════════════════════════════════════════════════════════
     AI Chat — 聊天助手面板
     ════════════════════════════════════════════════════════ -->

<button id="aiFab" class="ai-fab" title="AI 助手">
  <span class="ai-fab-icon">AI</span>
</button>

<div id="chatOverlay" class="chat-overlay"></div>

<div id="chatDrawer" class="chat-drawer">
  <div class="chat-header">
    <span class="chat-title">🤖 AI 助手</span>
    <span id="chatContext" class="chat-context">系统</span>
    <button id="chatClose" class="chat-close">✕</button>
  </div>
  <div id="chatMessages" class="chat-messages"></div>
  <div id="quickChips" class="quick-chips">
    <span class="chip" data-prompt="数据概览">📊 数据概览</span>
    <span class="chip" data-prompt="异常详情">🔍 异常详情</span>
    <span class="chip" data-prompt="趋势分析">📈 趋势分析</span>
  </div>
  <div class="chat-input-area">
    <input type="text" id="chatInput" placeholder="输入你的问题...">
    <button id="chatSend">发送</button>
  </div>
</div>

<div id="anomalyDetail" class="anomaly-detail">
  <div class="detail-header">
    <h3 id="detailTitle"></h3>
    <button onclick="ChatManager.closeDetail()">✕</button>
  </div>
  <div id="detailBody" class="detail-body"></div>
</div>

</body>
</html>
